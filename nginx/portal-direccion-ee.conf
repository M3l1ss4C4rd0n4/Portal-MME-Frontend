# Portal Dirección EE — MinMinas
# Escucha en puerto 80 (server_name) y puerto 3000 (para el WAF)
# Next.js server corre en 127.0.0.1:3001 gestionado por pm2

upstream nextjs_portal {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name portaldireccionee.minenergia.gov.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff2;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache de assets estáticos de Next.js
    location /_next/static/ {
        proxy_pass http://nextjs_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imágenes y fuentes públicas
    location ~* \.(ico|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://nextjs_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Todo el resto → Next.js
    location / {
        proxy_pass http://nextjs_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/portal-direccion-ee.access.log;
    error_log  /var/log/nginx/portal-direccion-ee.error.log warn;
}
