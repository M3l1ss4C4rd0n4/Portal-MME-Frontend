<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sin conexión | Portal Dirección de Energía</title>
  <style>
    :root { color-scheme: light dark; --fondo: #EEF2F9; --texto: #0F172A; --suave: #475569; --dorado: #B8860B; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo: #060B14; --texto: #F1F5F9; --suave: #94A3B8; --dorado: #FCC505; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; text-align: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      background: var(--fondo); color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { margin: 0; font-size: 1.35rem; }
    p { margin: 0; max-width: 28rem; line-height: 1.5; color: var(--suave); }
    button {
      min-height: 44px; padding: 0 1.5rem; border: 0; border-radius: 12px;
      background: var(--dorado); color: #1b1b1b; font-size: 1rem; font-weight: 600;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="Portal Dirección de Energía">
  <h1>Sin conexión</h1>
  <p>No se pudo conectar con el portal. Los datos se consultan en línea, así que necesita conexión a internet o a la red institucional para continuar.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</body>
</html>
